name: CI and publish containers

# CI runs on proposed changes; pushes to master can also publish release images.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    # This job is required before the publish job can start.
    name: Build frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        # npm ci installs exactly what package-lock.json records.
        run: npm ci

      - name: Build the frontend
        # A production build catches TypeScript and bundling errors.
        run: npm run build

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and verify the backend
        working-directory: backend
        # Maven compiles, runs available tests, and packages the API.
        run: mvn --batch-mode --no-transfer-progress verify

  publish:
    # Only the default branch publishes images, and only after CI passes.
    name: Publish Docker images to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Check the production API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set the API_BASE_URL repository variable to your deployed API URL, ending in /api."
            exit 1
          fi

      - name: Prepare lowercase image names
        id: image-name
        # GHCR requires lowercase package names; GitHub repository names may use capitals.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image-name.outputs.prefix }}-api:latest
            ${{ steps.image-name.outputs.prefix }}-api:${{ github.sha }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.API_BASE_URL }}
          tags: |
            ${{ steps.image-name.outputs.prefix }}-web:latest
            ${{ steps.image-name.outputs.prefix }}-web:${{ github.sha }}
