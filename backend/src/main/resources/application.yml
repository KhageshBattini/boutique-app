spring:
  application:
    name: boutique-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/alankrita?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:alankrita_app}
    password: ${DB_PASSWORD:change-this-to-a-strong-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
